상품을 3D로 미리 보고 현실세계에 배치하여 미리 볼 수 있습니다. 이를 통해 사용자는 더욱 몰입감 있는 경험을 제공합니다. 또한 사용자는 시뮬레이션 해 볼 수 있습니다.

<br>

#### 몰입감 있는 상품 홍보
고객이 상품을 실제 환경에 배치해보고 체험할 수 있도록 지원합니다.

<br>

#### 시뮬레이션
증강현실을 이용하여 실제 위치에 미리 배치하여 눈으로 확인해 볼 수 있습니다. 또한 추가적으로 AI를 활용하여 상품 추천 및 상담을 할 수 있습니다.
